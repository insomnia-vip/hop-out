<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
<title id="title">hop-out / receipt export</title><desc id="desc">A real subset of the synthetic JSON export, including demo provenance, position and the full-sale quote. JSON, text and Markdown exports are supported.</desc>
