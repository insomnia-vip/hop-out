<rect x="1" y="1" width="1198" height="828" rx="3" fill="#090d09" stroke="#34452b"/><rect x="2" y="2" width="1196" height="826" fill="url(#grid)"/>
<g font-family="Consolas,Menlo,DejaVu Sans Mono,monospace">
<rect x="1" y="1" width="1198" height="54" rx="3" fill="#11190f" stroke="#34452b"/><circle cx="25" cy="28" r="5" fill="#627558"/><circle cx="45" cy="28" r="5" fill="#627558"/><circle cx="65" cy="28" r="5" fill="#627558"/>
<text x="90" y="34" font-size="16" fill="#e6eddd" >hop-out / receipt export</text><text x="1166" y="34" font-size="13" fill="#caff38" text-anchor="end" letter-spacing="1">SYNTHETIC DEMO / JSON EXCERPT</text>
<text x="36" y="100" font-size="14" fill="#caff38" letter-spacing="1.4">04 / MACHINE-READABLE RECEIPTS</text><text x="36" y="140" font-size="27" fill="#e6eddd" >Keep the evidence with the numbers.</text><rect x="36" y="163" width="1128" height="51" rx="3" fill="#11190f" stroke="#34452b"/><text x="54" y="196" font-size="19" fill="#caff38" >$ pnpm hop demo --format json --output demo.json</text><rect x="36" y="237" width="696" height="524" rx="3" fill="#11190f" stroke="#34452b"/><rect x="756" y="237" width="408" height="524" rx="3" fill="#11190f" stroke="#34452b"/><text x="58" y="270" font-size="14" fill="#99ab8c" letter-spacing="1.4">demo.json / EXCERPT</text><text x="778" y="270" font-size="14" fill="#caff38" letter-spacing="1.4">ONE REPORT. THREE FORMATS.</text><text x="58" y="301" font-size="14" fill="#627558" >01</text><text x="94" y="301" font-size="16" fill="#99ab8c" xml:space="preserve">{</text><text x="58" y="319" font-size="14" fill="#627558" >02</text><text x="94" y="319" font-size="16" fill="#8cddd4" xml:space="preserve">  &quot;evidence&quot;: {</text><text x="58" y="337" font-size="14" fill="#627558" >03</text><text x="94" y="337" font-size="16" fill="#8cddd4" xml:space="preserve">    &quot;mode&quot;: &quot;demo&quot;,</text><text x="58" y="355" font-size="14" fill="#627558" >04</text><text x="94" y="355" font-size="16" fill="#8cddd4" xml:space="preserve">    &quot;sources&quot;: []</text><text x="58" y="373" font-size="14" fill="#627558" >05</text><text x="94" y="373" font-size="16" fill="#99ab8c" xml:space="preserve">  },</text><text x="58" y="391" font-size="14" fill="#627558" >06</text><text x="94" y="391" font-size="16" fill="#8cddd4" xml:space="preserve">  &quot;token&quot;: {</text><text x="58" y="409" font-size="14" fill="#627558" >07</text><text x="94" y="409" font-size="16" fill="#8cddd4" xml:space="preserve">    &quot;symbol&quot;: &quot;POND&quot;</text><text x="58" y="427" font-size="14" fill="#627558" >08</text><text x="94" y="427" font-size="16" fill="#99ab8c" xml:space="preserve">  },</text><text x="58" y="445" font-size="14" fill="#627558" >09</text><text x="94" y="445" font-size="16" fill="#8cddd4" xml:space="preserve">  &quot;position&quot;: {</text><text x="58" y="463" font-size="14" fill="#627558" >10</text><text x="94" y="463" font-size="16" fill="#8cddd4" xml:space="preserve">    &quot;source&quot;: &quot;amount&quot;,</text><text x="58" y="481" font-size="14" fill="#627558" >11</text><text x="94" y="481" font-size="16" fill="#8cddd4" xml:space="preserve">    &quot;amount&quot;: &quot;500000&quot;,</text><text x="58" y="499" font-size="14" fill="#627558" >12</text><text x="94" y="499" font-size="16" fill="#8cddd4" xml:space="preserve">    &quot;wallet&quot;: null</text><text x="58" y="517" font-size="14" fill="#627558" >13</text><text x="94" y="517" font-size="16" fill="#99ab8c" xml:space="preserve">  },</text><text x="58" y="535" font-size="14" fill="#627558" >14</text><text x="94" y="535" font-size="16" fill="#8cddd4" xml:space="preserve">  &quot;quotes&quot;: [</text><text x="58" y="553" font-size="14" fill="#627558" >15</text><text x="94" y="553" font-size="16" fill="#99ab8c" xml:space="preserve">    {</text><text x="58" y="571" font-size="14" fill="#627558" >16</text><text x="94" y="571" font-size="16" fill="#8cddd4" xml:space="preserve">      &quot;fraction&quot;: 1,</text><text x="58" y="589" font-size="14" fill="#627558" >17</text><text x="94" y="589" font-size="16" fill="#8cddd4" xml:space="preserve">      &quot;tokenAmount&quot;: &quot;500000&quot;,</text><text x="58" y="607" font-size="14" fill="#627558" >18</text><text x="94" y="607" font-size="16" fill="#8cddd4" xml:space="preserve">      &quot;proceedsQuote&quot;: 3.277310924369748,</text><text x="58" y="625" font-size="14" fill="#627558" >19</text><text x="94" y="625" font-size="16" fill="#8cddd4" xml:space="preserve">      &quot;haircutPct&quot;: 34.45378151260504</text><text x="58" y="643" font-size="14" fill="#627558" >20</text><text x="94" y="643" font-size="16" fill="#99ab8c" xml:space="preserve">    }</text><text x="58" y="661" font-size="14" fill="#627558" >21</text><text x="94" y="661" font-size="16" fill="#99ab8c" xml:space="preserve">  ]</text><text x="58" y="679" font-size="14" fill="#627558" >22</text><text x="94" y="679" font-size="16" fill="#99ab8c" xml:space="preserve">}</text><text x="778" y="330" font-size="28" fill="#e6eddd" >TEXT</text><text x="778" y="359" font-size="16" fill="#99ab8c" >Read it in your terminal.</text><text x="778" y="418" font-size="28" fill="#8cddd4" >JSON</text><text x="778" y="447" font-size="16" fill="#99ab8c" >Pipe it into your tools.</text><text x="778" y="506" font-size="28" fill="#caff38" >MARKDOWN</text><text x="778" y="535" font-size="16" fill="#99ab8c" >Share the full receipt.</text><path d="M778 568H1142V568" fill="none" stroke="#34452b"/><text x="778" y="602" font-size="14" fill="#99ab8c" letter-spacing="1.4">EXCLUSIVE FILE WRITES</text><text x="778" y="632" font-size="16" fill="#99ab8c" >Existing files are never</text><text x="778" y="656" font-size="16" fill="#99ab8c" >silently overwritten.</text><rect x="778" y="698" width="5" height="5" fill="#caff38"/><rect x="798" y="698" width="5" height="5" fill="#caff38"/><rect x="778" y="703" width="5" height="5" fill="#caff38"/><rect x="798" y="703" width="5" height="5" fill="#caff38"/><rect x="778" y="708" width="5" height="5" fill="#caff38"/><rect x="798" y="708" width="5" height="5" fill="#caff38"/><rect x="778" y="713" width="5" height="5" fill="#caff38"/><rect x="783" y="713" width="5" height="5" fill="#caff38"/><rect x="788" y="713" width="5" height="5" fill="#caff38"/><rect x="793" y="713" width="5" height="5" fill="#caff38"/><rect x="798" y="713" width="5" height="5" fill="#caff38"/><rect x="778" y="718" width="5" height="5" fill="#caff38"/><rect x="798" y="718" width="5" height="5" fill="#caff38"/><rect x="778" y="723" width="5" height="5" fill="#caff38"/><rect x="798" y="723" width="